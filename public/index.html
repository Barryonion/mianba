<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="面霸">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<title>面霸</title>
<style>
  :root { color-scheme: light dark; --accent: #0a84ff; --card: rgba(127,127,127,.12); --line: rgba(127,127,127,.25);
          --ok: #30d158; --warn: #ffd60a; --bad: #ff453a; --bar: color-mix(in srgb, Canvas 82%, transparent); }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0 auto; max-width: 760px;
         padding: env(safe-area-inset-top) 16px 40px; }
  #app > h1:first-child { margin-top: 16px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 12px; }
  h1 .sub { display: block; font-size: 16px; font-weight: 500; margin-top: 4px; }
  h1.req { font-size: 20px; }
  h2 { font-size: 17px; margin: 28px 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .top { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 10px 16px; background: var(--bar);
         -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .top a { font-size: 17px; display: inline-block; padding: 4px 8px 4px 0; }
  a.row:active, a.card:active, button:active, .btn:active { opacity: .6; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; font-size: 13px; opacity: .85; }
  .meta > span:not(.pill) { padding: 2px 0; opacity: .75; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--card); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); }
  .sc { float: right; margin-left: 8px; font-weight: 600; color: var(--accent); }
  .sc.ok { color: var(--ok); }
  .sc.warn { color: var(--warn); }
  .card .why { opacity: .75; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
  .tile small { font-size: 13px; }
  .tile b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .mrow { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 14px; }
  .mlbl { flex: none; width: 7.5em; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
  .mtrack { flex: 1; height: 14px; border-radius: 4px; background: var(--card); overflow: hidden; }
  .mfill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }
  .mval { flex: none; min-width: 4.5em; opacity: .7; font-variant-numeric: tabular-nums; }
  .gapc { border-left: 3px solid var(--bad); }
  .gapc.weak { border-left-color: var(--warn); }
  .gapc.strong { border-left-color: var(--ok); }
  .gapc .pill { margin-top: 6px; }
  .probe { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--card); }
  .lbl { margin-top: 8px; }
  .wide { display: block; text-align: center; margin: 12px 0; }
  .fold { margin: 8px 0; }
  .fold > summary { cursor: pointer; padding: 10px 0; opacity: .8; }
  .footer { margin-top: 40px; padding-top: 8px; border-top: 1px solid var(--line); }
  .footer .danger { margin-top: 8px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; margin: 0; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
  .chip.on { background: var(--accent); color: #fff; }
  button.link { background: none; padding: 0; margin: 0; font-size: 14px; color: var(--accent); }
  button.link.danger { color: var(--bad); }
  .composer { position: sticky; bottom: 0; z-index: 5; margin: 12px -16px 0; padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
              background: var(--bar); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  .composer .bar { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .composer .bar textarea { margin: 0; resize: none; max-height: 180px; }
  .composer .bar button { margin: 0; flex: none; }
  h2 small, small { font-weight: normal; opacity: .65; }
  a { color: var(--accent); text-decoration: none; }
  .row, .card { display: block; padding: 12px 14px; margin: 8px 0; background: var(--card); border-radius: 12px; color: inherit; }
  .row small, .card small { display: block; }
  .card div { font-size: 14px; }
  button, .btn { font: inherit; padding: 10px 16px; margin: 6px 6px 6px 0; border: 0; border-radius: 10px;
                 background: var(--card); color: inherit; cursor: pointer; display: inline-block; }
  .primary { background: var(--accent); color: #fff; }
  .danger { color: var(--bad); }
  input, textarea { font: inherit; width: 100%; padding: 10px; margin: 6px 0; border-radius: 10px;
                    border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit; }
  pre { white-space: pre-wrap; font: inherit; margin: 6px 0; }
  .stars { color: orange; float: right; }
  .pay { float: right; margin-left: 8px; color: #ff9f0a; font-weight: 600; }
  .pay.na { color: inherit; opacity: .55; font-weight: 400; }
  .new { color: #ff453a; font-weight: 600; }
  .tags { margin: 6px 0; }
  .tags span { display: inline-block; font-size: 12px; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 6px; background: var(--card); }
  .card .btn { font-size: 14px; padding: 6px 12px; }
  .md { white-space: normal; }
  .md div { white-space: pre-wrap; }
  .md .gap { height: .6em; }
  .md .mh { font-weight: 600; font-size: 17px; margin: 10px 0 4px; }
  .md blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--accent); opacity: .9; }
  .md hr { border: 0; border-top: 1px solid rgba(127,127,127,.35); margin: 10px 0; }
  .md code { font: 14px ui-monospace, Menlo, monospace; background: var(--card); padding: 1px 4px; border-radius: 4px; }
  .md pre.code { font: 13px/1.45 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.25); padding: 8px; border-radius: 8px; overflow-x: auto; white-space: pre; }
  .md .tbl { overflow-x: auto; margin: 6px 0; }
  .md table { border-collapse: collapse; font-size: 14px; }
  .md th, .md td { border: 1px solid rgba(127,127,127,.35); padding: 4px 8px; text-align: left; vertical-align: top; min-width: 4.5em; }
  .msg.md { max-width: 100%; }
  a.more { position: relative; padding-right: 28px; }
  a.more::after { content: "›"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: .4; font-size: 22px; }
  .card details { margin: 6px 0; font-size: 14px; }
  .card summary { cursor: pointer; color: var(--accent); }
  .msg { padding: 10px 14px; margin: 8px 0; border-radius: 14px; max-width: 85%; white-space: pre-wrap; width: fit-content; }
  .msg.assistant { background: var(--card); }
  .msg.user { background: var(--accent); color: #fff; margin-left: auto; }
  #busybar { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20;
             display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
             background: var(--bar); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
             border: 1px solid var(--line); font-size: 15px; pointer-events: none;
             box-shadow: 0 4px 16px rgba(0,0,0,.15); opacity: 0; visibility: hidden;
             transform: translateX(-50%) translateY(8px); transition: opacity .2s, transform .2s, visibility .2s; }
  body.busy #busybar { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .spin { width: 16px; height: 16px; border-radius: 50%; flex: none;
         border: 2px solid var(--line); border-top-color: var(--accent); animation: bspin .8s linear infinite; }
  @keyframes bspin { to { transform: rotate(360deg); } }
  #busybar b { font-variant-numeric: tabular-nums; }
  .loading { display: grid; place-items: center; gap: 12px; padding: 56px 0; opacity: .85; }
  .loading .spin { width: 24px; height: 24px; border-width: 3px; }
</style>
</head>
<body>
<div id="app"><div class=loading><span class=spin></span><small>加载中…</small></div></div>
<div id=busybar><span class=spin></span>AI 思考中 <b id=busysec></b></div>
<script src="/app.js"></script>
</body>
</html>
