name: Check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check server.js && node --check public/app.js && node --check jobwatch/watcher.js && node --check jobwatch/store.js && node --check ops/gitnudge.js && node --check ops/daily.js && sh -n ops/backup.sh && sh -n ops/watchdog.sh
